esphome:
  name: quickmill-sunny-bridge
  platform: ESP32
  board: esp32dev

wifi:
  ssid: "Quickmill5D"
  password: "2046quickmill24"
  fast_connect: true

logger:

api:

ota:

http_request:
  base_url: "http://192.168.1.1"

sensor:
  - platform: http
    name: "Sunny Brew Temp C"
    resource: "http://192.168.1.1/getConfig"
    json_attributes:
      - "coffeeTemperature_C"
      - "serviceTemperature_C"
      - "statoMacchina"
      - "livello_H2O"
    scan_interval: 30s

  - platform: http
    name: "Sunny Single Preinfusion"
    resource: "http://192.168.1.1/getConfig"
    json_attributes:
      - "Dose1preinfusion"
    scan_interval: 60s

  - platform: http
    name: "Sunny Single Infusion"
    resource: "http://192.168.1.1/getConfig"
    json_attributes:
      - "Dose1Infusion"
    scan_interval: 60s

  - platform: http
    name: "Sunny Double Preinfusion"
    resource: "http://192.168.1.1/getConfig"
    json_attributes:
      - "Dose2preinfusion"
    scan_interval: 60s

  - platform: http
    name: "Sunny Double Infusion"
    resource: "http://192.168.1.1/getConfig"
    json_attributes:
      - "Dose2Infusion"
    scan_interval: 60s

  - platform: http
    name: "Sunny Water Dose"
    resource: "http://192.168.1.1/getConfig"
    json_attributes:
      - "DoseWater"
    scan_interval: 60s

  - platform: http
    name: "Sunny Setpoint Coffee"
    resource: "http://192.168.1.1/getConfig"
    json_attributes:
      - "setpoint_Group"
    scan_interval: 60s

  - platform: http
    name: "Sunny Setpoint Steam"
    resource: "http://192.168.1.1/getConfig"
    json_attributes:
      - "setpoint_Service"
    scan_interval: 60s

  - platform: http
    name: "Sunny Filter Life"
    resource: "http://192.168.1.1/getConfig"
    json_attributes:
      - "lifeFilter"
    scan_interval: 300s

  - platform: http
    name: "Sunny Total Counter"
    resource: "http://192.168.1.1/getConfig"
    json_attributes:
      - "CoffeAll"
    scan_interval: 300s

  - platform: http
    name: "Sunny Partial Counter"
    resource: "http://192.168.1.1/getConfig"
    json_attributes:
      - "CoffePartial"
    scan_interval: 300s

number:
  - platform: template
    name: "Sunny Single Preinfusion [s]"
    unit_of_measurement: "s"
    min_value: 0
    max_value: 30
    step: 1
    initial_value: 3
    optimistic: true
    set_action:
      - http_request.post:
          url: "http://192.168.1.1/setDose1preinf/!{{ value | int }}"
          headers:
            Content-Type: "application/json"

  - platform: template
    name: "Sunny Single Infusion [s]"
    unit_of_measurement: "s"
    min_value: 5
    max_value: 99
    step: 1
    initial_value: 25
    optimistic: true
    set_action:
      - http_request.post:
          url: "http://192.168.1.1/setDose1inf/!{{ value | int }}"
          headers:
            Content-Type: "application/json"

  - platform: template
    name: "Sunny Double Preinfusion [s]"
    unit_of_measurement: "s"
    min_value: 0
    max_value: 30
    step: 1
    initial_value: 9
    optimistic: true
    set_action:
      - http_request.post:
          url: "http://192.168.1.1/setDose2preinf/!{{ value | int }}"
          headers:
            Content-Type: "application/json"

  - platform: template
    name: "Sunny Double Infusion [s]"
    unit_of_measurement: "s"
    min_value: 5
    max_value: 99
    step: 1
    initial_value: 16
    optimistic: true
    set_action:
      - http_request.post:
          url: "http://192.168.1.1/setDose2inf/!{{ value | int }}"
          headers:
            Content-Type: "application/json"

  - platform: template
    name: "Sunny Water Dose [s]"
    unit_of_measurement: "s"
    min_value: 5
    max_value: 99
    step: 1
    initial_value: 10
    optimistic: true
    set_action:
      - http_request.post:
          url: "http://192.168.1.1/setDoseWater/!{{ value | int }}"
          headers:
            Content-Type: "application/json"

  - platform: template
    name: "Sunny Setpoint Coffee [°C]"
    unit_of_measurement: "°C"
    min_value: 20
    max_value: 302
    step: 1
    initial_value: 94
    optimistic: true
    set_action:
      - http_request.post:
          url: "http://192.168.1.1/setpoint_Group/!{{ value | int }}"
          headers:
            Content-Type: "application/json"

  - platform: template
    name: "Sunny Setpoint Steam [°C]"
    unit_of_measurement: "°C"
    min_value: 20
    max_value: 302
    step: 1
    initial_value: 130
    optimistic: true
    set_action:
      - http_request.post:
          url: "http://192.168.1.1/setpoint_Service/!{{ value | int }}"
          headers:
            Content-Type: "application/json"

  - platform: template
    name: "Sunny Filter Life"
    unit_of_measurement: "h"
    min_value: 0
    max_value: 10000
    step: 100
    initial_value: 1000
    optimistic: true
    set_action:
      - http_request.post:
          url: "http://192.168.1.1/setFiltroAcqua/!{{ value | int }}"
          headers:
            Content-Type: "application/json"

switch:
  - platform: template
    name: "Sunny Kaffee starten"
    icon: "mdi:coffee"
    turn_on_action:
      - http_request.post:
          url: "http://192.168.1.1/ON_OFF/!statePower$ON"
          headers:
            Content-Type: "application/json"
      - delay: 1s
      - logger.log: "Kaffee gestartet"
    turn_off_action:
      - http_request.post:
          url: "http://192.168.1.1/ON_OFF/!statePower$OFF"
          headers:
            Content-Type: "application/json"
      - logger.log: "Kaffee gestoppt"

  - platform: template
    name: "Sunny Dampf ein"
    icon: "mdi:steam"
    turn_on_action:
      - http_request.post:
          url: "http://192.168.1.1/EnableService/!1"
          headers:
            Content-Type: "application/json"
    turn_off_action:
      - http_request.post:
          url: "http://192.168.1.1/EnableService/!0"
          headers:
            Content-Type: "application/json"

  - platform: template
    name: "Sunny Eco Mode"
    icon: "mdi:leaf"
    turn_on_action:
      - http_request.post:
          url: "http://192.168.1.1/EnableECO/!1"
          headers:
            Content-Type: "application/json"
    turn_off_action:
      - http_request.post:
          url: "http://192.168.1.1/EnableECO/!0"
          headers:
            Content-Type: "application/json"

  - platform: template
    name: "Sunny Standby"
    icon: "mdi:sleep"
    turn_on_action:
      - http_request.post:
          url: "http://192.168.1.1/EnableStandby/!1"
          headers:
            Content-Type: "application/json"
    turn_off_action:
      - http_request.post:
          url: "http://192.168.1.1/EnableStandby/!0"
          headers:
            Content-Type: "application/json"

  - platform: template
    name: "Sunny Neustart"
    icon: "mdi:restart"
    turn_on_action:
      - http_request.post:
          url: "http://192.168.1.1/Riavvio/"
          headers:
            Content-Type: "application/json"
      - delay: 2s
      - logger.log: "Neustart eingeleitet"